# ArcMux production stack (build from source + PostgreSQL + Redis)
#
# Prefer the one-click script:
#   ./scripts/deploy-docker.sh
#
# Or manually:
#   cp deploy/docker.env.example .env.prod
#   # edit secrets in .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  arcmux:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ARCMUX_IMAGE:-arcmux:latest}
    container_name: arcmux
    restart: always
    command: --log-dir /app/logs
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${LOG_DIR:-./logs}:/app/logs
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SQL_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      ERROR_LOG_ENABLED: ${ERROR_LOG_ENABLED:-true}
      BATCH_UPDATE_ENABLED: ${BATCH_UPDATE_ENABLED:-true}
      NODE_NAME: ${NODE_NAME:-arcmux-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      UPSTREAM_CREDENTIAL_ENCRYPTION_KEY: ${UPSTREAM_CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - arcmux-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: arcmux-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - arcmux-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: arcmux-pg
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - arcmux-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
  redis_data:

networks:
  arcmux-net:
    driver: bridge
